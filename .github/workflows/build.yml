name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica database modelli (gratis)
        shell: bash
        run: |
          curl -sSL -o tac_full.csv https://raw.githubusercontent.com/MoazEb/tac-database/29ed8f61c6bfad300ce6b56f36c3876c4dc6a6d9/tac_full.csv
          node scripts/build-tacdb.js tac_full.csv
      - run: npm install
      - run: npm test
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run build:win
      - name: Build Mac
        if: runner.os == 'macOS'
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: IMEI-Model-Checker-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
